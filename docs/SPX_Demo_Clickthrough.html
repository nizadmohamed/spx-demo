<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPX HVAC Segment – Clickable demo prototype</title>
<style>

:root{
  color-scheme: light;
  --bg:#F5F4F8; --surface:#FFFFFF; --ink:#1D1727; --muted:#5D5670; --line:#E1DDE9;
  --accent:#7500C0; --accent-soft:#F1E6FA; --star:#9A5B00; --star-soft:#FFF3DC;
  --ok:#1F7A45; --ok-soft:#E3F4EA; --risk:#A3320B; --risk-soft:#FCE9E2;
  /* Salesforce mockup palette – stays light in both modes, like a screenshot */
  --sf-page:#EEF1F6; --sf-surface:#FFFFFF; --sf-ink:#181818; --sf-muted:#5C5C5C; --sf-weak:#747474;
  --sf-line:#E5E5E5; --sf-line2:#C9C9C9; --sf-brand:#0176D3; --sf-brand-dk:#014486; --sf-brand-lt:#EEF4FF;
  --sf-green:#2E844A; --sf-green-lt:#E6F4EA; --sf-warn:#A96404; --sf-warn-lt:#FEF1E1; --sf-red:#BA0517; --sf-red-lt:#FDECEC;
  --sf-gray-lt:#F3F3F3; --sf-sandbox:#2B2B2B; --sf-purple:#5A1BA9;
  --font: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#16131C; --surface:#211C29; --ink:#EEEAF5; --muted:#ABA3BA; --line:#3A3346;
    --accent:#CB8CFF; --accent-soft:#33244A; --star:#F2B75B; --star-soft:#3A2D17;
    --ok:#6FD39A; --ok-soft:#1C3527; --risk:#FF9B79; --risk-soft:#3D231B;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font); background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:248px 1fr; min-height:100vh}
.side{position:sticky; top:0; height:100vh; overflow:auto; border-right:1px solid var(--line); background:var(--surface); padding:22px 14px}
.side .kit{font-size:13px; color:var(--muted); margin:0 10px 2px}
.side h1{font-size:19px; line-height:1.25; margin:0 10px 20px; font-weight:650}
.nav{list-style:none; margin:0; padding:0}
.nav button{all:unset; box-sizing:border-box; width:100%; display:grid; grid-template-columns:30px 1fr; gap:6px; align-items:start; padding:9px 10px; border-radius:8px; cursor:pointer; color:var(--ink); font-size:14px; line-height:1.3}
.nav button:hover{background:var(--accent-soft)}
.nav button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.nav .n{font-variant-numeric:tabular-nums; color:var(--muted); font-weight:600}
.nav button[aria-current="true"] .n{color:var(--accent)}
.nav .sep{height:1px; background:var(--line); margin:10px 10px}
.nav .starred .n{color:var(--star)}
.main{padding:34px 44px 80px; min-width:0}
.page{display:none; max-width:1240px}
.page.on{display:block}

.step-head{display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:start; margin-bottom:22px}
.big-n{font-size:64px; line-height:.9; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.big-n.star{color:var(--star)}
.step-head h2{font-size:28px; line-height:1.15; margin:2px 0 8px; font-weight:650; letter-spacing:-.01em}
.ask{margin:0; color:var(--muted); max-width:78ch}
.ask q{color:var(--ink)}
.cap{display:inline-block; margin-top:10px; font-size:13px; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600}
.cap.star{background:var(--star-soft); color:var(--star)}

.lede{font-size:17px; max-width:76ch; margin:0 0 22px}
h3{font-size:18px; margin:30px 0 10px; font-weight:650}
h4{font-size:15px; margin:18px 0 6px; font-weight:650}
p{max-width:80ch}
.muted{color:var(--muted)}

/* screen stepper */
.screens{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px}
.screens button{all:unset; cursor:pointer; padding:7px 12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; background:var(--surface); color:var(--ink)}
.screens button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px var(--accent)}
.screens .k{color:var(--muted); margin-right:6px; font-variant-numeric:tabular-nums}
.screen{display:none}.screen.on{display:block}
.caption{font-size:13.5px; color:var(--muted); margin:10px 2px 0; max-width:100ch}

/* build panels */
.build{display:grid; grid-template-columns:1.25fr 1fr; gap:22px; margin-top:28px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px}
.panel h3{margin-top:0}
.panel.full{grid-column:1/-1}
table.spec{width:100%; border-collapse:collapse; font-size:13.5px}
table.spec th{text-align:left; font-weight:600; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line)}
table.spec td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top}
table.spec td:first-child{font-weight:600; white-space:nowrap}
table.spec code, .panel code{font-family:Consolas, "SFMono-Regular", Menlo, monospace; font-size:12.5px; background:var(--accent-soft); color:var(--ink); padding:1px 5px; border-radius:4px}
ol.script{margin:0; padding-left:22px}
ol.script li{margin:0 0 7px}
ol.script .who{font-weight:600}
.callout{border-left:3px solid var(--risk); background:var(--risk-soft); padding:10px 14px; border-radius:0 8px 8px 0; margin:12px 0; font-size:14px}
.callout.ok{border-color:var(--ok); background:var(--ok-soft)}
.callout.star{border-color:var(--star); background:var(--star-soft)}
ul.tight{margin:0; padding-left:20px}
ul.tight li{margin-bottom:6px}
.effort{display:flex; gap:18px; flex-wrap:wrap; font-size:13.5px; color:var(--muted); margin-top:12px}
.effort b{color:var(--ink)}

/* overview */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.cast{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.person{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px}
.person b{display:block; font-size:15px}
.person span{color:var(--muted)}
.ros{width:100%; border-collapse:collapse; font-size:14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.ros td,.ros th{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.ros th{color:var(--muted); font-weight:600; font-size:13px}
.ros .t{font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600}
.bar{height:8px; border-radius:4px; background:var(--accent); opacity:.85}
.bar.star{background:var(--star)}

/* ================= Salesforce mockup ================= */
.sf{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--sf-page); color:var(--sf-ink); font-size:13px; line-height:1.4; box-shadow:0 10px 30px -18px rgba(20,10,40,.45)}
.sf *{color:inherit}
.chrome{display:flex; align-items:center; gap:10px; background:#DFE3EA; padding:7px 12px; border-bottom:1px solid #CBD2DC}
.dots{display:flex; gap:6px}.dots i{width:10px; height:10px; border-radius:50%; background:#B8BFCA; display:block}
.url{flex:1; background:#fff; border-radius:6px; padding:3px 10px; font-size:12px; color:var(--sf-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who-chip{font-size:12px; background:#fff; border-radius:999px; padding:2px 10px 2px 3px; display:flex; align-items:center; gap:6px; color:var(--sf-ink); white-space:nowrap}
.av{width:20px; height:20px; border-radius:50%; display:inline-grid; place-items:center; font-size:10px; font-weight:700; color:#fff; background:var(--sf-brand-dk)}
.sandbox-bar{background:var(--sf-sandbox); color:#fff; font-size:12px; padding:5px 14px; display:flex; justify-content:space-between}
.sandbox-bar *{color:#fff}
.prod-bar{background:var(--sf-green); color:#fff; font-size:12px; padding:5px 14px}
.prod-bar *{color:#fff}
.g-head{display:flex; align-items:center; gap:14px; background:var(--sf-surface); padding:7px 14px; border-bottom:1px solid var(--sf-line)}
.logo{width:34px; height:24px; border-radius:5px; background:var(--sf-brand-dk); color:#fff; font-weight:800; font-size:11px; display:grid; place-items:center; letter-spacing:.02em}
.logo *{color:#fff}
.search{flex:1; max-width:520px; margin:0 auto; border:1px solid var(--sf-line2); border-radius:5px; padding:5px 10px; color:var(--sf-weak); font-size:12.5px}
.g-icons{display:flex; gap:10px; color:var(--sf-muted)}
.g-icons span{width:18px; height:18px; border-radius:50%; border:1.5px solid #9AA0A8; display:block}
.app-nav{display:flex; align-items:stretch; background:var(--sf-surface); border-bottom:3px solid var(--sf-brand); padding:0 10px; gap:2px; overflow:hidden; white-space:nowrap}
.waffle{display:grid; grid-template-columns:repeat(3,4px); gap:2px; padding:12px 8px; align-self:center}
.waffle i{width:4px; height:4px; background:#706E6B; border-radius:1px; display:block}
.app-name{font-size:16px; font-weight:600; padding:9px 18px 9px 6px; align-self:center}
.app-nav .tab{padding:10px 11px 8px; font-size:13px; color:var(--sf-ink); border-bottom:3px solid transparent; margin-bottom:-3px}
.app-nav .tab.on{border-bottom-color:var(--sf-brand-dk); font-weight:600; background:var(--sf-brand-lt)}
.sf-body{padding:12px}
.row{display:grid; gap:12px}
.c2{grid-template-columns:2fr 1fr}.c11{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--sf-surface); border:1px solid var(--sf-line); border-radius:4px; box-shadow:0 2px 2px 0 rgba(0,0,0,.08); margin-bottom:12px}
.card-h{display:flex; align-items:center; gap:9px; padding:10px 12px; border-bottom:1px solid var(--sf-line)}
.card-h h5{margin:0; font-size:14px; font-weight:700; flex:1}
.card-b{padding:10px 12px}
.ico{width:24px; height:24px; border-radius:4px; display:inline-grid; place-items:center; color:#fff; font-size:11px; font-weight:700; flex:none}
.ico *{color:#fff}
.ico.lg{width:36px; height:36px; font-size:15px}
.i-opp{background:#FF5D2D}.i-acc{background:#5867E8}.i-con{background:#A094ED}.i-lead{background:#F88962}.i-proj{background:#0B827C}
.i-quote{background:#88C651}.i-xref{background:#3C97DD}.i-rep{background:#F4BC25}.i-mdt{background:#7E8BE4}.i-dash{background:#EF6E64}.i-dev{background:#9050E9}.i-list{background:#3BA755}
.btn{display:inline-block; border:1px solid var(--sf-line2); background:#fff; color:var(--sf-brand); border-radius:4px; padding:4px 12px; font-size:12.5px; font-weight:600; white-space:nowrap; cursor:default; font-family:inherit}
.btn.brand{background:var(--sf-brand); border-color:var(--sf-brand); color:#fff}
.btn.brand *{color:#fff}
button.btn{cursor:pointer}
button.btn:hover{filter:brightness(.95)}
.btn-grp{display:flex; gap:0}
.btn-grp .btn{border-radius:0; margin-left:-1px}.btn-grp .btn:first-child{border-radius:4px 0 0 4px; margin-left:0}.btn-grp .btn:last-child{border-radius:0 4px 4px 0}
.hl{background:var(--sf-surface); border:1px solid var(--sf-line); border-radius:4px; box-shadow:0 2px 2px 0 rgba(0,0,0,.08); margin-bottom:12px}
.hl-top{display:flex; align-items:center; gap:11px; padding:12px 14px 10px}
.hl-top .t{flex:1; min-width:0}
.hl-top .obj{font-size:12px; color:var(--sf-muted)}
.hl-top .nm{font-size:18px; font-weight:700; line-height:1.2}
.hl-fields{display:flex; flex-wrap:wrap; gap:6px 30px; padding:0 14px 12px 61px}
.hl-fields div{font-size:12px; color:var(--sf-muted)}
.hl-fields b{display:block; font-size:13px; color:var(--sf-ink); font-weight:400}
.path{display:flex; gap:3px; padding:10px 12px}
.path span{flex:1; text-align:center; font-size:12px; padding:7px 4px 7px 14px; background:var(--sf-gray-lt); color:var(--sf-ink); clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%, 9px 50%); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.path span:first-child{clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); border-radius:14px 0 0 14px}
.path span:last-child{clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 9px 50%); border-radius:0 14px 14px 0}
.path .done{background:var(--sf-green); color:#fff}
.path .cur{background:var(--sf-brand-dk); color:#fff; font-weight:600}
.path .won{background:var(--sf-green); color:#fff}
.guide{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:4px 14px 12px; font-size:12.5px}
.guide h6{margin:0 0 4px; font-size:12.5px}
.guide ul{margin:0; padding-left:16px}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:0 22px}
.f{border-bottom:1px solid var(--sf-line); padding:6px 0 5px; display:flex; justify-content:space-between; gap:8px; min-height:44px}
.f .l{font-size:12px; color:var(--sf-muted); display:block}
.f .v{font-size:13px}
.f .pen,.f .lock{flex:none; width:14px; height:14px; margin-top:12px; opacity:.55}
.lk{color:var(--sf-brand)}
.sec{font-size:13.5px; font-weight:700; background:var(--sf-gray-lt); padding:5px 8px; margin:10px 0 2px; border-radius:3px}
table.dt{width:100%; border-collapse:collapse; font-size:12.5px}
table.dt th{text-align:left; font-weight:600; color:var(--sf-muted); background:#FAFAF9; padding:6px 8px; border-bottom:1px solid var(--sf-line); white-space:nowrap}
table.dt td{padding:7px 8px; border-bottom:1px solid var(--sf-line); vertical-align:middle}
table.dt tr.hot td{background:#FFF8E6}
table.dt tr.new td{background:var(--sf-brand-lt)}
table.dt td.lk{white-space:nowrap}
.noicon .pen,.noicon .lock{display:none}
table.dt .num{text-align:right; font-variant-numeric:tabular-nums}
.pill{display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--sf-gray-lt); color:var(--sf-ink); white-space:nowrap}
.pill.g{background:var(--sf-green-lt); color:var(--sf-green)}
.pill.w{background:var(--sf-warn-lt); color:var(--sf-warn)}
.pill.r{background:var(--sf-red-lt); color:var(--sf-red)}
.pill.b{background:var(--sf-brand-lt); color:var(--sf-brand-dk)}
.pill.p{background:#F2EBFC; color:var(--sf-purple)}
.toast{display:flex; gap:10px; align-items:center; background:var(--sf-green); color:#fff; border-radius:4px; padding:9px 14px; margin-bottom:12px; font-size:13px}
.toast *{color:#fff}
.toast.info{background:#706E6B}
.toast.warn{background:#FE9339; color:#181818}
.toast.warn *{color:#181818}
.alert{border:1px solid #F3B3B3; background:var(--sf-red-lt); border-radius:4px; padding:10px 12px; font-size:12.5px; margin-bottom:12px}
.alert b{color:var(--sf-red)}
.tile{background:var(--sf-surface); border:1px solid var(--sf-line); border-radius:4px; padding:10px 12px}
.tile .l{font-size:12px; color:var(--sf-muted)}
.tile .v{font-size:24px; font-weight:300; line-height:1.2; font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px; color:var(--sf-muted)}
.tile .v.red{color:var(--sf-red); font-weight:500}
.modal-wrap{background:rgba(8,7,7,.5); padding:24px; border-radius:0}
.modal{background:#fff; border-radius:4px; max-width:820px; margin:0 auto; overflow:hidden}
.modal-h{text-align:center; padding:14px; font-size:18px; font-weight:400; border-bottom:1px solid var(--sf-line)}
.modal-b{padding:14px 20px; background:#fff}
.modal-f{background:var(--sf-gray-lt); padding:10px 16px; text-align:right; border-top:1px solid var(--sf-line); display:flex; justify-content:flex-end; gap:8px}
.conv{display:grid; grid-template-columns:110px 1fr 1fr; gap:10px; padding:12px 0; border-bottom:1px solid var(--sf-line); align-items:start}
.conv:last-child{border-bottom:0}
.conv .h{font-weight:700; font-size:14px}
.opt{border:1px solid var(--sf-line2); border-radius:4px; padding:8px 10px; font-size:12.5px}
.opt.sel{border-color:var(--sf-brand); box-shadow:inset 0 0 0 1px var(--sf-brand); background:var(--sf-brand-lt)}
.radio{display:inline-block; width:12px; height:12px; border-radius:50%; border:1.5px solid #888; margin-right:6px; vertical-align:-1px}
.opt.sel .radio{border:4px solid var(--sf-brand)}
.input{border:1px solid var(--sf-line2); border-radius:4px; padding:4px 8px; font-size:12.5px; background:#fff; margin-top:3px}
.tree{font-size:13px}
.tree .node{display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid var(--sf-line)}
.tree .node.d1{padding-left:34px}.tree .node.d2{padding-left:60px}
.tree .node .grow{flex:1}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; border:1px solid var(--sf-line2); border-radius:3px; padding:1px 6px; background:#fff; color:var(--sf-muted); margin-left:4px; white-space:nowrap}
.chip.new{border-color:var(--sf-brand); color:var(--sf-brand-dk); background:var(--sf-brand-lt); font-weight:600}
.meter{height:14px; border-radius:7px; background:var(--sf-warn-lt); overflow:hidden; display:flex}
.meter i{display:block; height:100%; background:var(--sf-brand)}
.feed{font-size:12.5px}
.feed div{padding:7px 0; border-bottom:1px solid var(--sf-line)}
.feed div:last-child{border-bottom:0}
.feed .when{color:var(--sf-weak); font-size:11.5px}
.split{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.split > .sf{box-shadow:none}
.hbar{display:grid; grid-template-columns:110px 1fr 64px; align-items:center; gap:8px; font-size:12px; margin:6px 0}
.hbar .track{display:flex; height:18px; background:#F3F3F3; border-radius:2px; overflow:hidden}
.hbar .track i{display:block; height:100%}
.hbar .val{text-align:right; font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--sf-muted); margin-top:6px}
.legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:0}
.funnel div{margin:0 auto 3px; text-align:center; color:#fff; font-size:11.5px; padding:5px 0; border-radius:2px}
.funnel div *{color:#fff}
.gauge{display:block; margin:0 auto}
.persona-switch{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.persona-switch button{all:unset; cursor:pointer; display:flex; gap:8px; align-items:center; padding:7px 12px 7px 7px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); font-size:13.5px}
.persona-switch button[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); font-weight:600}
.persona-switch .av{width:24px; height:24px; font-size:11px}
.why{font-size:12px; color:var(--sf-muted)}
.mask{color:var(--sf-weak); font-style:italic}
.dim td{color:#9B9B9B}

@media (max-width: 1000px){
  .shell{grid-template-columns:1fr}
  .side{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line)}
  .nav{display:flex; overflow-x:auto; gap:4px}
  .nav li{flex:none}
  .nav .sep{display:none}
  .main{padding:22px 16px 60px}
  .build,.grid2,.grid3,.cast,.c2,.c11,.c3,.c4,.split{grid-template-columns:1fr}
  .big-n{font-size:44px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

/* ---------- click-through shell ---------- */
body{background:var(--bg)}
.ct-top{display:flex; align-items:center; gap:18px; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap}
.ct-top h1{font-size:17px; margin:0; font-weight:650; white-space:nowrap}
.ct-top .sub{color:var(--muted); font-size:13px}
.ct-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto}
.ct-tabs button{all:unset; cursor:pointer; padding:7px 12px; border-radius:8px; border:1px solid var(--line); font-size:13.5px; color:var(--ink); background:var(--surface); white-space:nowrap}
.ct-tabs button:hover{background:var(--accent-soft)}
.ct-tabs button[aria-current="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); color:var(--accent); font-weight:600}
.ct-tabs button.star{color:var(--star)}
.ct-tabs button.star[aria-current="true"]{border-color:var(--star); box-shadow:inset 0 0 0 1px var(--star)}
.ct-tabs .done-tick{color:var(--ok); margin-left:4px}
.ct-main{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:20px; padding:20px 24px 40px; align-items:start}
.stage{min-width:0}
.stage .sf{min-height:560px; display:flex; flex-direction:column}
.stage .sf > .sf-body{flex:1}
.split .sf{display:flex; flex-direction:column}
.split .sf > .sf-body{flex:1}
.presenter{position:sticky; top:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px}
.presenter .scn{font-size:13px; color:var(--muted); margin:0 0 2px}
.presenter h2{font-size:18px; line-height:1.25; margin:0 0 12px; font-weight:650}
.dots-prog{display:flex; gap:4px; margin:0 0 14px}
.dots-prog i{flex:1; height:4px; border-radius:2px; background:var(--line); display:block}
.dots-prog i.on{background:var(--accent)}
.dots-prog i.cur{background:var(--accent); opacity:.45}
.presenter.star .dots-prog i.on{background:var(--star)}
.presenter.star .dots-prog i.cur{background:var(--star)}
.pstep{font-size:13px; color:var(--muted); margin:0 0 4px; font-variant-numeric:tabular-nums}
.pdo{font-size:15px; font-weight:600; margin:0 0 12px; line-height:1.4}
.psay{font-size:14px; line-height:1.55; margin:0 0 14px; padding:10px 12px; border-radius:8px; background:var(--accent-soft)}
.presenter.star .psay{background:var(--star-soft)}
.psay b{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:2px}
.pwatch{font-size:13px; color:var(--muted); margin:0 0 14px; line-height:1.45; border-left:3px solid var(--line); padding-left:10px}
.pwatch b{color:var(--ink)}
.pswitch{all:unset; box-sizing:border-box; cursor:pointer; display:block; width:100%; text-align:center; padding:10px; border-radius:8px; background:var(--accent); color:var(--surface); font-weight:600; font-size:14px; margin:0 0 12px}
.presenter.star .pswitch{background:var(--star); color:var(--surface)}
.pnav{display:flex; gap:8px}
.pnav button{all:unset; cursor:pointer; flex:1; text-align:center; padding:8px; border:1px solid var(--line); border-radius:8px; font-size:13px; color:var(--ink)}
.pnav button:hover{background:var(--accent-soft)}
.pnav button:disabled{opacity:.4; cursor:default}
.pend{font-size:14px; padding:12px; border-radius:8px; background:var(--ok-soft); color:var(--ink); margin:0 0 12px}
.keys{font-size:12px; color:var(--muted); margin-top:12px}

/* hotspots */
[data-go]{cursor:pointer; position:relative}
.sf [data-go]{animation:hot 1.6s ease-in-out infinite; border-radius:4px}
@keyframes hot{0%,100%{box-shadow:0 0 0 2px rgba(255,140,0,.95), 0 0 0 6px rgba(255,140,0,.0)}50%{box-shadow:0 0 0 2px rgba(255,140,0,.95), 0 0 0 7px rgba(255,140,0,.28)}}
.sf.nudge [data-go]{animation:none; box-shadow:0 0 0 3px #FF8C00, 0 0 0 10px rgba(255,140,0,.35)}
tr[data-go] td{background:#FFF6E5 !important}
.hide-hot .sf [data-go]{animation:none; box-shadow:none}
.hide-hot tr[data-go] td{background:inherit !important}
@media (prefers-reduced-motion: reduce){ .sf [data-go]{animation:none; box-shadow:0 0 0 2px #FF8C00} }

/* extra Salesforce bits for the prototype */
.loginas-bar{background:#F3F3F3; color:#181818; font-size:12px; padding:5px 14px; display:flex; justify-content:space-between; border-bottom:1px solid #DDDBDA}
.loginas-bar a{color:var(--sf-brand); text-decoration:none}
.bookmarks{background:#F7F8FA; border-bottom:1px solid #DDE1E7; padding:4px 12px; font-size:12px; display:flex; gap:14px; color:#3E3E3C}
.bookmarks span{white-space:nowrap}
.utility{position:relative; background:#fff; border-top:1px solid var(--sf-line); padding:6px 12px; font-size:12.5px; display:flex; gap:16px}
.util-panel{position:absolute; bottom:34px; left:12px; width:320px; background:#fff; border:1px solid var(--sf-line2); border-radius:4px 4px 0 0; box-shadow:0 -2px 8px rgba(0,0,0,.15)}
.util-panel .card-h{background:#F3F3F3}
.bell-drop{position:absolute; right:60px; top:44px; width:360px; background:#fff; border:1px solid var(--sf-line2); border-radius:4px; box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:5}
.bell-drop .it{padding:10px 12px; border-bottom:1px solid var(--sf-line); font-size:12.5px}
.bell-dot{position:relative}
.bell-dot::after{content:"1"; position:absolute; top:-6px; right:-6px; background:var(--sf-red); color:#fff; font-size:9px; width:13px; height:13px; border-radius:50%; display:grid; place-items:center}
.g-head{position:relative}
.spinner{display:inline-block; width:14px; height:14px; border:2px solid #C9C9C9; border-top-color:var(--sf-brand); border-radius:50%; animation:spin 1s linear infinite; vertical-align:-2px; margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:8px; background:#E5E5E5; border-radius:4px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--sf-brand)}
.denied{max-width:560px; margin:60px auto; text-align:center; background:#fff; border:1px solid var(--sf-line); border-radius:4px; padding:30px}
.denied h4{font-size:20px; margin:0 0 8px; font-weight:400}
.flow-modal .modal-h{font-weight:400}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px}
.form-grid label{font-size:12px; color:var(--sf-muted); display:block}
.form-grid .input{margin-top:3px}
.pickrow{display:flex; gap:10px; align-items:center; border:1px solid var(--sf-line2); border-radius:4px; padding:8px 10px; margin-bottom:6px; font-size:12.5px}
.pickrow.sel{border-color:var(--sf-brand); box-shadow:inset 0 0 0 1px var(--sf-brand); background:var(--sf-brand-lt)}
.inline-edit{background:#FFF8E6}
.diff-del{text-decoration:line-through; color:#9B9B9B}
.split{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.split .sf{min-height:520px}




/* ---------- Setup, App Builder and Flow Builder (step 6) ---------- */
.om{display:grid; grid-template-columns:190px minmax(0,1fr); gap:12px}
.om-nav{background:#fff; border:1px solid var(--sf-line); border-radius:4px; padding:6px 0; font-size:12.5px; align-self:start}
.om-nav div{padding:7px 12px; color:var(--sf-ink)}
.om-nav div.on{background:var(--sf-brand-lt); border-left:3px solid var(--sf-brand-dk); font-weight:600; padding-left:9px}
.om-crumb{font-size:12px; color:var(--sf-muted); margin-bottom:6px}
.ab-bar{display:flex; align-items:center; gap:10px; background:#16325C; color:#fff; padding:8px 12px; font-size:12.5px; border-radius:4px 4px 0 0}
.ab-bar *{color:#fff}
.ab-bar .btn{color:var(--sf-brand); background:#fff}
.ab-bar .btn.brand{background:var(--sf-brand); color:#fff; border-color:#fff}
.ab{display:grid; grid-template-columns:150px minmax(0,1fr) 250px; border:1px solid var(--sf-line2); border-top:0; background:#fff; min-height:380px}
.ab-pal{border-right:1px solid var(--sf-line); padding:8px; font-size:11.5px; color:var(--sf-muted)}
.ab-pal div{padding:5px 6px; border:1px solid var(--sf-line); border-radius:3px; margin-bottom:4px; background:#FAFAF9; color:var(--sf-ink)}
.ab-canvas{background:#F3F3F3; padding:12px; font-size:12px}
.ab-sec{background:#fff; border:1px dashed #A0A0A0; border-radius:4px; padding:8px 10px; margin-bottom:8px}
.ab-sec.sel{border:2px solid var(--sf-brand); box-shadow:0 0 0 3px rgba(1,118,211,.15)}
.ab-sec h6{margin:0 0 6px; font-size:12px; display:flex; gap:6px; align-items:center}
.ab-sec .fl{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; color:var(--sf-muted)}
.eye{font-size:10.5px; font-weight:700; color:#fff; background:#706E6B; border-radius:3px; padding:1px 5px}
.ab-props{border-left:1px solid var(--sf-line); padding:10px; font-size:12px}
.ab-props h6{margin:0 0 8px; font-size:12.5px}
.ab-props .flt{border:1px solid var(--sf-line2); border-radius:4px; padding:7px 8px; background:var(--sf-brand-lt); margin-top:6px}
.fb-bar{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--sf-line2); padding:8px 12px; font-size:12.5px; border-radius:4px 4px 0 0}
.fb-bar .t{flex:1}
.fb{display:grid; grid-template-columns:minmax(0,1fr) 0; border:1px solid var(--sf-line2); border-top:0; background:#F5F7FA; min-height:430px; background-image:radial-gradient(#D8DDE6 1px, transparent 1px); background-size:16px 16px}
.fb.panel{grid-template-columns:minmax(0,1fr) 280px}
.fb-canvas{padding:14px; display:flex; flex-direction:column; align-items:center; font-size:11.5px}
.fe{background:#fff; border:1px solid var(--sf-line2); border-radius:6px; padding:6px 10px; display:flex; gap:8px; align-items:center; min-width:200px; box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fe .ic{width:20px; height:20px; border-radius:4px; display:grid; place-items:center; color:#fff; font-size:10px; font-weight:700; flex:none}
.fe .ic *{color:#fff}
.fe.sel{border:2px solid var(--sf-brand)}
.fline{width:2px; height:14px; background:#9AA4B2}
.fbranches{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; border-top:2px solid #9AA4B2; padding-top:10px; margin-top:0}
.fbr{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px}
.fbr .lbl{background:#fff; border:1px solid var(--sf-line2); border-radius:10px; padding:1px 7px}
.fbr.new .lbl{background:#FFF3DC; border-color:#E0A23A; font-weight:700}
.fbr .fe{min-width:0; padding:4px 7px; font-size:10.5px}
.fb-panel{border-left:1px solid var(--sf-line2); background:#fff; padding:12px; font-size:12px}
.fb-panel h6{margin:0 0 8px; font-size:13px}
.cond{border:1px solid var(--sf-line2); border-radius:4px; padding:6px 8px; margin-top:6px; background:#FAFAF9}
.cond.new{background:#FFF3DC; border-color:#E0A23A}
.formula{font-family:Consolas, Menlo, monospace; font-size:11.5px; background:#F3F3F3; border:1px solid var(--sf-line); border-radius:4px; padding:8px 10px; white-space:pre-wrap; line-height:1.5}
.chk{display:inline-block; width:14px; height:14px; border:1.5px solid #888; border-radius:3px; vertical-align:-2px; margin-right:6px; background:#fff}
.chk.on{background:var(--sf-brand); border-color:var(--sf-brand); position:relative}
.chk.on::after{content:"✓"; color:#fff; font-size:10px; position:absolute; left:2px; top:-1px}
.plan-row{display:grid; grid-template-columns:22px 1fr 120px; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--sf-line); font-size:12.5px}
.f.err{background:var(--sf-red-lt)}
.f.err .l{color:var(--sf-red)}
.path span.pick{outline:2px solid var(--sf-brand); outline-offset:-2px; background:#fff; color:var(--sf-brand-dk); font-weight:600}
.badge.add{background:#FFF0D6; color:#8A4B00}
.pipe{display:grid; grid-template-columns:1fr 60px 1fr; gap:0; align-items:stretch}
.pipe .env{background:#fff; border:1px solid var(--sf-line2); border-radius:6px; padding:10px 12px}
.pipe .env h6{margin:0 0 6px; font-size:13px}
.pipe .arrow{display:grid; place-items:center; font-size:22px; color:var(--sf-weak)}
.step-row{display:grid; grid-template-columns:22px 1fr 110px; gap:8px; padding:7px 0; border-bottom:1px solid var(--sf-line); font-size:12.5px; align-items:center}
.cgrid td:first-child{width:28px}
@media (prefers-color-scheme: dark){ .badge.add{background:#3A2D17; color:#F2C27A} }


/* ---------- Claude workspace (enterprise AI tool, outside Salesforce) ---------- */
.cl{display:grid; grid-template-columns:190px minmax(0,1fr) 380px; min-height:520px; background:#FAF9F5; color:#1F1E1D; font-size:12.5px}
.cl *{color:inherit}
.cl-side{border-right:1px solid #E5E2DA; padding:12px; background:#F3F1EA}
.cl-side .pj{font-weight:700; margin:0 0 8px}
.cl-side .kn{font-size:11.5px; color:#6B675E; margin:10px 0 4px; font-weight:600}
.cl-side .fl{background:#fff; border:1px solid #E5E2DA; border-radius:6px; padding:5px 7px; margin-bottom:5px; font-size:11.5px}
.cl-chat{padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.cl-u{align-self:flex-end; background:#EDE9DF; border-radius:12px; padding:9px 12px; max-width:85%}
.cl-a{line-height:1.55}
.cl-a p{margin:0 0 6px}
.cl-a ul{margin:4px 0 6px; padding-left:18px}
.cl-in{margin-top:auto; border:1px solid #DAD6CC; border-radius:12px; background:#fff; padding:10px 12px; color:#8A867C}
.cl-art{border-left:1px solid #E5E2DA; background:#fff; padding:14px 16px; overflow:hidden}
.cl-art h6{margin:0 0 2px; font-size:14px}
.cl-art .ver{font-size:11px; color:#8A867C; margin-bottom:10px}
.cl-art h7{display:block; font-weight:700; font-size:12px; margin:10px 0 4px}
.cl-art table{width:100%; border-collapse:collapse; font-size:11.5px}
.cl-art td,.cl-art th{border-bottom:1px solid #EEE; padding:3px 4px; text-align:left; vertical-align:top}
.cl-chip{display:inline-block; border:1px solid #CFCAC0; border-radius:14px; padding:5px 10px; background:#fff; margin:2px 4px 2px 0}
.cl-file{display:inline-block; font-size:11.5px; border:1px solid #DAD6CC; background:#fff; border-radius:6px; padding:3px 8px; margin:0 4px 4px 0}
.badge.claude{background:#F3E9DF; color:#8A4A1E}
@media (prefers-color-scheme: dark){ .badge.claude{background:#3A2A1E; color:#F0C7A0} }

/* toggle switch */
.tgl{width:34px; height:18px; border-radius:9px; background:#C9C9C9; position:relative; display:inline-block; flex:none}
.tgl i{position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; display:block}
.tgl.on{background:var(--sf-brand)}
.tgl.on i{left:18px}
/* ---------- layer toggles + presenter badges ---------- */
.feat-toggles{display:flex; gap:8px; align-items:center; width:100%; justify-content:flex-end; font-size:13px; color:var(--muted)}
.ft{display:flex; gap:6px; align-items:center; padding:5px 10px; border-radius:999px; border:1px solid var(--line); cursor:pointer; color:var(--ink); background:var(--surface)}
.ft input{accent-color:var(--accent); margin:0}
.ft.iag{border-color:#7FB3E6}.ft.ai{border-color:#B79AF0}
.badge{display:inline-block; font-size:12px; font-weight:650; padding:3px 9px; border-radius:999px; margin:0 0 10px}
.badge.iag{background:#E1EEFB; color:#0B4F8A}
.badge.ai{background:#EEE6FC; color:#5A1BA9}
@media (prefers-color-scheme: dark){ .badge.iag{background:#16324D; color:#9CCBF5} .badge.ai{background:#2E2147; color:#CFB6FA} }
.prec{font-size:13px; line-height:1.5; margin:0 0 14px; padding:10px 12px; border-radius:8px; background:var(--ok-soft); border-left:3px solid var(--ok)}
.prec b{display:block; font-size:12.5px; color:var(--ok); font-weight:650; margin-bottom:2px}
.pbuild{font-size:13px; line-height:1.5; margin:0 0 14px; padding:10px 12px; border-radius:8px; border:1px dashed var(--line)}
.pbuild b{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:2px}
.plic{font-size:12px; color:var(--muted); margin:-6px 0 14px}

/* ---------- Agentforce side panel (illustrative) ---------- */
.sf{position:relative}
.sf-body{position:relative}
.with-agent{display:grid; grid-template-columns:minmax(0,1fr) 350px; gap:12px; align-items:start}
.with-agent .main-col{min-width:0}
.af{background:#fff; border:1px solid var(--sf-line2); border-radius:6px; display:flex; flex-direction:column; min-height:470px; box-shadow:0 4px 14px rgba(0,0,0,.12); position:sticky; top:0}
.af-h{display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--sf-line); font-weight:700; font-size:13.5px}
.af-h .x{margin-left:auto; color:var(--sf-weak); font-weight:400}
.af-logo{width:22px; height:22px; border-radius:50%; background:linear-gradient(135deg,#0176D3,#9050E9); color:#fff; display:grid; place-items:center; font-size:11px; flex:none}
.af-logo *{color:#fff}
.af-sub{font-weight:400; color:var(--sf-weak); font-size:11.5px}
.af-msgs{padding:12px; flex:1; display:flex; flex-direction:column; gap:10px; font-size:12.5px; line-height:1.45}
.af-u{align-self:flex-end; background:var(--sf-brand); color:#fff; border-radius:12px 12px 2px 12px; padding:8px 11px; max-width:88%}
.af-u *{color:#fff}
.af-a{align-self:stretch; background:#F4F6FA; border-radius:12px 12px 12px 2px; padding:10px 12px}
.af-a p{margin:0 0 6px}
.af-a ul,.af-a ol{margin:4px 0 6px; padding-left:18px}
.af-a li{margin-bottom:4px}
.af-card{background:#fff; border:1px solid var(--sf-line); border-radius:6px; padding:8px 10px; margin-top:8px}
.af-card h6{margin:0 0 3px; font-size:12.5px}
.af-chips{display:flex; flex-direction:column; gap:6px; margin-top:4px}
.af-chip{border:1px solid #9CC3EE; color:var(--sf-brand-dk); border-radius:14px; padding:6px 11px; font-size:12px; background:#fff; align-self:flex-start}
.af-file{display:inline-flex; gap:6px; align-items:center; font-size:11.5px; border:1px solid var(--sf-line2); border-radius:4px; padding:3px 8px; background:#fff; margin:0 4px 4px 0}
.af-act{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.af-used{font-size:11px; color:var(--sf-weak); margin-top:6px}
.af-in{border-top:1px solid var(--sf-line); padding:10px 12px}
.af-in .input{color:var(--sf-weak)}
.af-note{font-size:10.5px; color:var(--sf-weak); margin-top:6px}
.af-ico{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; color:#9050E9; border:1.5px solid #B79AF0}
.af-ico.on{background:linear-gradient(135deg,#0176D3,#9050E9); color:#fff; border-color:transparent}
table.mini{width:100%; border-collapse:collapse; font-size:11.5px; margin-top:4px}
table.mini th{text-align:left; color:var(--sf-muted); font-weight:600; padding:3px 4px; border-bottom:1px solid var(--sf-line)}
table.mini td{padding:4px; border-bottom:1px solid var(--sf-line); vertical-align:top}
.conf{display:inline-block; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:8px}
.conf.h{background:var(--sf-green-lt); color:var(--sf-green)}.conf.m{background:var(--sf-warn-lt); color:var(--sf-warn)}.conf.l{background:#F3F3F3; color:var(--sf-muted)}

/* ---------- In-App Guidance prompts ---------- */
.iag-float{position:absolute; top:36px; left:50%; transform:translateX(-50%); width:430px; max-width:calc(100% - 24px); background:#fff; border-radius:8px; box-shadow:0 14px 36px rgba(0,0,0,.3); overflow:hidden; z-index:20}
.iag-hero{height:104px; background:linear-gradient(120deg,#014486,#0176D3 60%,#3BA7E8); position:relative; overflow:hidden}
.iag-hero i{position:absolute; border-radius:50%; background:rgba(255,255,255,.14); display:block}
.iag-hero span{position:absolute; left:18px; bottom:14px; color:#fff; font-size:13px; font-weight:600; letter-spacing:.01em}
.iag-b{padding:14px 16px 12px}
.iag-step{font-size:11px; color:var(--sf-weak)}
.iag-b h6{font-size:16px; margin:2px 0 6px; line-height:1.3}
.iag-b p{margin:0; font-size:12.5px; line-height:1.5; color:#3E3E3C}
.iag-f{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px; font-size:12px}
.iag-target{position:absolute; width:300px; z-index:20; background:#fff; border-radius:8px; box-shadow:0 10px 28px rgba(0,0,0,.28); padding:12px 14px; border-top:4px solid var(--sf-brand-dk)}
.iag-target .iag-b{padding:0}
.iag-arr{position:absolute; width:14px; height:14px; background:#fff; transform:rotate(45deg); box-shadow:-2px -2px 4px rgba(0,0,0,.06)}
.iag-dock{position:absolute; right:12px; top:12px; width:330px; background:#fff; border-radius:8px; box-shadow:0 10px 28px rgba(0,0,0,.25); z-index:20; overflow:hidden; border:1px solid var(--sf-line)}
.iag-dock .dk-h{background:var(--sf-brand-dk); color:#fff; padding:9px 12px; font-size:12.5px; font-weight:700; display:flex; justify-content:space-between}
.iag-dock .dk-h *{color:#fff}
.iag-dock ol{margin:6px 0 0; padding-left:18px; font-size:12.5px}
.iag-dock li{margin-bottom:5px}
[data-anchor].hl-anchor{box-shadow:0 0 0 2px #0176D3; border-radius:4px}
.g-icons .hl-anchor{border-radius:50% !important; box-shadow:0 0 0 3px #0176D3}
@media (max-width: 1100px){ .with-agent{grid-template-columns:1fr} }

@media (max-width: 1100px){ .ct-main{grid-template-columns:1fr} .presenter{position:static} .split{grid-template-columns:1fr} }
</style>

  return `<aside class="af"><div class="af-h"><span class="af-logo">✦</span><div>Agentforce<div class="af-sub">${o.sub||'Sales assistant'}</div></div><span class="x">✕</span></div><div class="af-msgs">${m}</div><div class="af-in"><div class="input">Ask Agentforce...</div><div class="af-note">Illustrative. Responses are generated from records you can access; check before acting.</div></div></aside>`;}
const used=t=>`<div class="af-used">Used: ${t}</div>`;
const acts=(arr,hot)=>`<div class="af-act">${arr.map((a,i)=>`<span class="btn${i===hot?' brand':''}" ${i===hot?'data-go':''}>${a}</span>`).join('')}</div>`;
const hero=(label)=>`<div class="iag-hero"><i style="width:160px;height:160px;right:-30px;top:-60px"></i><i style="width:90px;height:90px;right:120px;top:40px"></i><i style="width:50px;height:50px;left:40%;top:-15px"></i><span>${label}</span></div>`;
function FLOAT(step,title,body,primary,o={}){return `<div class="iag-float">${hero(o.hero||'SPX HVAC Segment')}<div class="iag-b"><div class="iag-step">${step}</div><h6>${title}</h6><p>${body}</p><div class="iag-f"><span class="lk">Remind me later</span><span style="display:flex;gap:10px;align-items:center">${o.extra||''}<span class="btn brand" data-go>${primary}</span></span></div></div></div>`;}
function TARGET(id,side,step,title,body,primary){return `<div class="iag-target" data-for="${id}" data-side="${side}"><span class="iag-arr"></span><div class="iag-b"><div class="iag-step">${step}</div><h6>${title}</h6><p>${body}</p><div class="iag-f"><span class="lk">Dismiss</span><span class="btn brand" data-go>${primary||'Got it'}</span></div></div></div>`;}
function ins2(key,idx,arr,where){const S=find(key), target=ORIG[key][idx]; let pos=S.screens.indexOf(target);
  if(where==='start') while(pos>0 && S.screens[pos-1].kind) pos--;
  S.screens.splice(pos,0,...arr.map(x=>({feat:x.kind,...x})));}
const H=(k,i)=>ORIG[k][i].html;
const IAGB='Configured in Setup › In-App Guidance, no code. ';
const AIB='Agentforce is a roadmap capability, separately licensed and consumption-based; not assumed in Foundation scope. ';
const pair=(base,sub,intro,chips,q,answer,o)=>[{kind:'ai',html:withAgent(base,AF([{a:`<p>${intro}</p>`},{chips,hot:0}],{sub})),...o[0]},{kind:'ai',html:withAgent(base,AF([{u:q},{a:answer}],{sub})),...o[1]}];


})();
/* ================= engine ================= */
(function(){
  const stage=document.getElementById('stage'), pres=document.getElementById('presenter'), tabs=document.getElementById('tabs');
  const done=new Set(); let sc=0, i=0;
  const feat={ai:true, iag:true};
  const vis=S=>S.screens.filter(s=>!s.feat||feat[s.feat]);
  window.VIS=k=>vis(SC[k]).length;
  tabs.innerHTML=SC.map((s,k)=>`<button data-k="${k}" class="${s.star?'star':''}">${s.label}<span class="done-tick" hidden>✓</span></button>`).join('');
  function render(){
    const S=SC[sc], list=vis(S), scr={...list[i]}; if(i===list.length-1) scr.end=true;
    stage.innerHTML=scr.html;
    [...tabs.children].forEach((b,k)=>{b.setAttribute('aria-current',k===sc?'true':'false'); b.querySelector('.done-tick').hidden=!done.has(k);});
    pres.className='presenter'+(S.star?' star':'');
    pres.innerHTML=`<p class="scn">Scenario ${S.label.replace(/^(\S+)\s.*/,'$1')}</p><h2>${S.title}</h2>
      <div class="dots-prog">${list.map((_,k)=>`<i class="${k<i?'on':k===i?'cur':''}"></i>`).join('')}</div>
      ${scr.kind==='iag'?'<span class="badge iag">In-App Guidance</span>':scr.kind==='ai'?'<span class="badge ai">Agentforce: art of the possible</span>':scr.kind==='add'?'<span class="badge add">Suggested addition</span>':scr.kind==='claude'?'<span class="badge claude">Claude: existing enterprise AI tool</span>':''}
      <p class="pstep">Step ${i+1} of ${list.length}</p>
      <p class="pdo">${scr.do}</p>
      ${scr.say?`<div class="psay"><b>Say</b>${scr.say}</div>`:''}
      ${scr.rec?`<div class="prec"><b>Recommended practice</b>${scr.rec}</div>`:''}
      ${scr.build?`<div class="pbuild"><b>How we'd build it</b>${scr.build}</div>`:''}
      ${scr.watch?`<p class="pwatch"><b>Presenter note.</b> ${scr.watch}</p>`:''}
      ${scr.switchTo?`<button class="pswitch" data-act="next">${scr.switchTo}</button>`:''}
      ${scr.end?`<div class="pend">End of scenario.${sc<SC.length-1?' Next up: '+SC[sc+1].label+'.':''}</div>`:''}
      <div class="pnav"><button data-act="back" ${i===0?'disabled':''}>Back</button><button data-act="restart">Restart</button><button data-act="${scr.end?'nextsc':'next'}">${scr.end?(sc<SC.length-1?'Next scenario':'Done'):'Skip'}</button></div>
      <p class="keys">Keys: right arrow next, left arrow back, H hides highlights.</p>`;
    try{ history.replaceState(null,'',`#${S.key}/${i+1}`); }catch(err){ /* sandboxed preview: ignore */ }
    requestAnimationFrame(placeTargets);
  }
  function next(){const L=vis(SC[sc]); if(i<L.length-1){i++;} else {done.add(sc); return nextsc();} if(L[i].end||i===L.length-1) done.add(sc); render(); window.scrollTo({top:0,behavior:'smooth'});}
  function nextsc(){done.add(sc); if(sc<SC.length-1){sc++; i=0;} render(); window.scrollTo({top:0});}
  function back(){if(i>0){i--; render();}}
  stage.addEventListener('click',e=>{
    if(e.target.closest('[data-go]')) return next();
    const f=stage.querySelector('.sf [data-go]') ? [...stage.querySelectorAll('.sf')].find(x=>x.querySelector('[data-go]')) : null;
    if(f){f.classList.add('nudge'); setTimeout(()=>f.classList.remove('nudge'),700);}
  });
  pres.addEventListener('click',e=>{const a=e.target.closest('[data-act]'); if(!a||a.disabled) return;
    ({next,back,nextsc,restart:()=>{i=0; render();}})[a.dataset.act]();});
  tabs.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; sc=+b.dataset.k; i=0; render();});
  document.addEventListener('keydown',e=>{ if(e.target.closest('input,textarea')) return;
    if(e.key==='ArrowRight') next(); else if(e.key==='ArrowLeft') back(); else if(e.key.toLowerCase()==='h') document.body.classList.toggle('hide-hot');});
  const m=location.hash.match(/^#(s\d)\/(\d+)$/);
  if(m){const k=SC.findIndex(s=>s.key===m[1]); if(k>=0){sc=k; i=Math.min(+m[2]-1, vis(SC[k]).length-1);}}
  function placeTargets(){
    stage.querySelectorAll('.iag-target').forEach(t=>{
      const a=stage.querySelector(`[data-anchor="${t.dataset.for}"]`); if(!a) return;
      const sf=a.closest('.sf'); if(t.parentElement!==sf) sf.appendChild(t);
      a.classList.add('hl-anchor');
      const ar=a.getBoundingClientRect(), sr=sf.getBoundingClientRect(), tw=t.offsetWidth, th=t.offsetHeight, arr=t.querySelector('.iag-arr');
      const side=t.dataset.side||'bottom'; let x,y;
      if(side==='bottom'){x=ar.left-sr.left+ar.width/2-tw/2; y=ar.bottom-sr.top+12;}
      else if(side==='left'){x=ar.left-sr.left-tw-14; y=ar.top-sr.top+ar.height/2-th/2;}
      else if(side==='right'){x=ar.right-sr.left+14; y=ar.top-sr.top-10;}
      else {x=ar.left-sr.left+ar.width/2-tw/2; y=ar.top-sr.top-th-12;}
      x=Math.max(8,Math.min(x,sf.clientWidth-tw-8)); y=Math.max(8,y);
      t.style.left=x+'px'; t.style.top=y+'px';
      const ax=ar.left-sr.left+ar.width/2-x-7, ay=ar.top-sr.top+ar.height/2-y-7;
      if(side==='bottom'){arr.style.left=Math.max(12,Math.min(ax,tw-26))+'px'; arr.style.top='-7px';}
      else if(side==='top'){arr.style.left=Math.max(12,Math.min(ax,tw-26))+'px'; arr.style.bottom='-7px';}
      else if(side==='left'){arr.style.right='-7px'; arr.style.top=Math.max(12,Math.min(ay,th-26))+'px';}
      else {arr.style.left='-7px'; arr.style.top=Math.max(12,Math.min(ay,th-26))+'px';}
    });
  }
  window.addEventListener('resize',()=>requestAnimationFrame(placeTargets));
  [['tgAi','ai'],['tgIag','iag']].forEach(([id,k])=>document.getElementById(id).addEventListener('change',ev=>{feat[k]=ev.target.checked; i=0; render();}));
  render();
})();
</script>
</body>
